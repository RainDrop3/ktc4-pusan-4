# G3 · 통신 안분 — 회선이 업무 전용인지 공용인지
#
# R-205(G2)가 '확인필요'로 넘긴 건을 여기서 가른다. G2 에서 가능을 확정하지
# 않은 것이 이 카드가 동작할 수 있는 전제다(평가셋 E-038).
#
# ⚠️ fact_type 과 선택지 값을 평가셋(PR #25)에 맞춘다 — E-037·E-038 이 통신에
#    (merchant, 전용여부, 전용/공용) 으로 답한다. 이름을 바꾸면 그 두 건이 못 맞는다.
#    그런데 R-101(구독서비스)도 group_by merchant_norm 에 fact_type '전용여부'를
#    쓰면서 값은 '업무 전용/개인 전용/업무·개인 혼용' 이다. 같은 이름에 어휘가 둘이라
#    R-103 헤더가 경고한 상황 그대로다. 평가셋이 통신 쪽 어휘를 먼저 못박았으므로
#    R-101 을 맞추는 쪽이 맞다고 보고 PR #27 리뷰로 올린다.
#
# ⚠️ '업무·개인 공용' 선택지에 verdict 를 두지 않는다. 비율을 우리가 제안하면
#    세무 조언이 된다. 확인필요를 유지한 채 안분 단계로 넘긴다.
id: R-230
